<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Lab 1. Introduction to HTML5 and HLS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1> My HLS Video Player</h1>
    
    <!-- Video Player -->
    <video id="videoPlayer" width="640" height="360" controls>
        <source src="https://d2zihajmogu5jn.cloudfront.net/bipbop-advanced/bipbop_16x9_variant.m3u8" type="application/x-mpegURL">
        Your browser does not support the video tag.
    </video>
    
    
    <div class="controls">
        <button id="playBtn"> Play</button>
        <button id="pauseBtn"> Pause</button>
        <button id="stopBtn"> Stop</button>
        <button id="forwardBtn"> +5s</button>
        <button id="backwardBtn"> -5s</button>
    </div>
    
    <!-- Playlist Section -->
    <div class="playlist">
        <h3> Playlist</h3>
        <p>
            <input type="text" id="url1" size="70" value="https://d2zihajmogu5jn.cloudfront.net/bipbop-advanced/bipbop_16x9_variant.m3u8">
            <button id="load1">Load Video 1</button>
        </p>
        <p>
            <input type="text" id="url2" size="70" value="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8">
            <button id="load2">Load Video 2</button>
        </p>
    </div>

    <script src="js/control.js"></script>
</body>
</html>
